<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HAKI Cafe System</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: #f7f7f5;
      color: #1f1f1f;
    }

    .app {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 230px;
      background: #ffffff;
      border-right: 1px solid #e8e8e5;
      padding: 28px 18px;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 35px;
      padding: 0 10px;
    }

    .brand span {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #888;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .nav-title {
      font-size: 10px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 0 10px;
      margin-bottom: 8px;
    }

    .nav-item {
      display: block;
      padding: 10px;
      margin-bottom: 3px;
      border-radius: 8px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .nav-item.active {
      background: #f0f0ed;
      color: #111;
      font-weight: 600;
    }

    .main {
      flex: 1;
      padding: 35px;
      max-width: 1400px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.5px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #666;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf50;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: #fff;
      border: 1px solid #e8e8e5;
      border-radius: 12px;
      padding: 20px;
    }

    .card-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
    }

    .card-value {
      font-size: 25px;
      font-weight: 650;
    }

    .section {
      background: #fff;
      border: 1px solid #e8e8e5;
      border-radius: 12px;
      padding: 22px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    #system-message {
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 900px) {

      .sidebar {
        width: 190px;
      }

      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 600px) {

      .app {
        display: block;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #e8e8e5;
      }

      .main {
        padding: 20px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="brand">
        ☕ HAKI
        <span>CAFE SYSTEM</span>
      </div>

      <div class="nav-title">
        Operations
      </div>

      <a href="#" class="nav-item active">
        Dashboard
      </a>

     <a href="inventory.html" class="nav-item">
  Inventory
</a>

      <a href="#" class="nav-item">
        Sales
      </a>

      <a href="#" class="nav-item">
        Stock Movement
      </a>

      <a href="#" class="nav-item">
        Menu Costing
      </a>

      <br>

      <div class="nav-title">
        System
      </div>

      <a href="#" class="nav-item">
        Settings
      </a>

    </aside>


    <!-- MAIN -->

    <main class="main">

      <div class="header">

        <div>
          <h1>Dashboard</h1>
        </div>

        <div class="status">

          <div class="status-dot"></div>

          <span>
            System Online
          </span>

        </div>

      </div>


      <!-- SUMMARY CARDS -->

      <div class="cards">

        <div class="card">

          <div class="card-label">
            TODAY'S SALES
          </div>

          <div
            class="card-value"
            id="today-sales"
          >
            —
          </div>

        </div>


        <div class="card">

          <div class="card-label">
            ITEMS SOLD
          </div>

          <div
            class="card-value"
            id="items-sold"
          >
            —
          </div>

        </div>


        <div class="card">

          <div class="card-label">
            INVENTORY ITEMS
          </div>

          <div
            class="card-value"
            id="inventory-items"
          >
            —
          </div>

        </div>


        <div class="card">

          <div class="card-label">
            MENU ITEMS
          </div>

          <div
            class="card-value"
            id="menu-items"
          >
            —
          </div>

        </div>

      </div>


      <!-- SYSTEM MESSAGE -->

      <div class="section">

        <div class="section-title">
          HAKI Cafe System
        </div>

        <div id="system-message">
          Connecting to the backend...
        </div>

      </div>

    </main>

  </div>


  <!-- API CONNECTION TEST -->

  <script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js?v=2"></script>

<script>

  async function testConnection() {

    const message =
      document.getElementById(
        "system-message"
      );


    try {

      const result =
        await apiRequest("health");


      if (result.success) {

        message.textContent =
          "Connected to HAKI Cafe System API.";

        await loadDashboard();

      }

    } catch (error) {

  console.error(
    "HAKI API ERROR:",
    error
  );

  message.textContent =
    "API Error: " +
    error.message;

}

  }


  testConnection();

</script>

</body>
</html>
