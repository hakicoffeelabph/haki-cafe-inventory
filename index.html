<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dashboard | HAKI Cafe System</title>

  <!-- GLOBAL DESIGN SYSTEM -->
  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>


  <!-- ======================================================
       SIDEBAR
       ====================================================== -->

  <aside class="sidebar">

    <div class="brand">
      ☕ HAKI
      <span>CAFE SYSTEM</span>
    </div>


    <div class="nav-title">
      Operations
    </div>


    <a
      href="index.html"
      class="nav-item active"
    >
      Dashboard
    </a>


    <a
      href="inventory.html"
      class="nav-item"
    >
      Inventory
    </a>


    <a
      href="#"
      class="nav-item"
    >
      Sales
    </a>


    <a
      href="#"
      class="nav-item"
    >
      Stock Movement
    </a>


    <a
      href="#"
      class="nav-item"
    >
      Menu Costing
    </a>


    <br>


    <div class="nav-title">
      System
    </div>


    <a
      href="#"
      class="nav-item"
    >
      Settings
    </a>

  </aside>



  <!-- ======================================================
       MAIN
       ====================================================== -->

  <main class="main">


    <!-- PAGE HEADER -->

    <div class="header">

      <div>

        <h1>
          Dashboard
        </h1>

      </div>


      <div class="status">

        <div class="status-dot"></div>

        <span>
          System Online
        </span>

      </div>

    </div>



    <!-- ====================================================
         SUMMARY CARDS
         ==================================================== -->

    <div class="cards">


      <!-- TODAY'S SALES -->

      <div class="card">

        <div class="card-label">
          TODAY'S SALES
        </div>

        <div
          class="card-value"
          id="today-sales"
        >
          —
        </div>

      </div>



      <!-- ITEMS SOLD -->

      <div class="card">

        <div class="card-label">
          ITEMS SOLD
        </div>

        <div
          class="card-value"
          id="items-sold"
        >
          —
        </div>

      </div>



      <!-- INVENTORY -->

      <div class="card">

        <div class="card-label">
          INVENTORY ITEMS
        </div>

        <div
          class="card-value"
          id="inventory-items"
        >
          —
        </div>

      </div>



      <!-- MENU -->

      <div class="card">

        <div class="card-label">
          MENU ITEMS
        </div>

        <div
          class="card-value"
          id="menu-items"
        >
          —
        </div>

      </div>

    </div>



    <!-- ====================================================
         SYSTEM MESSAGE
         ==================================================== -->

    <div class="section">

      <div class="section-title">
        HAKI Cafe System
      </div>


      <div id="system-message">
        Connecting to HAKI Cafe System API...
      </div>

    </div>


  </main>



  <!-- ======================================================
       JAVASCRIPT
       ====================================================== -->

  <script src="js/config.js"></script>

  <script src="js/api.js"></script>

  <script src="js/dashboard.js?v=3"></script>


</body>

</html>
